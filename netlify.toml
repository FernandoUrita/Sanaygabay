# netlify.toml

[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ============================================================
# API redirects (para sa Netlify Functions)
# ============================================================
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ============================================================
# MAINTENANCE MODE REDIRECTS
# ============================================================
# IMPORTANTE: Ang order ay mahalaga!
# Mga assets muna, tapos catch-all sa huli.

# Hayaan ang assets (CSS, JS, images) na ma-access
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

# Hayaan ang maintenance page mismo (para hindi infinite loop)
[[redirects]]
  from = "/maintenance.html"
  to = "/maintenance.html"
  status = 200

# Hayaan ang favicon
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

# ============================================================
# CATCH-ALL: Lahat ng ibang URLs → maintenance page
# ============================================================
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 200